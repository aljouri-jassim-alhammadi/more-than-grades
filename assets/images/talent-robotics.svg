<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="650" cy="120" r="180" fill="#a78bfa" opacity="0.12" filter="url(#glowEffect)" />
  <circle cx="150" cy="380" r="150" fill="#7c3aed" opacity="0.1" filter="url(#glowEffect)" />

  <!-- Geometric Grid &amp; Circuit Lines (AI Aesthetic) -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.2">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="380" x2="800" y2="380" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Central Visual Card / Shield -->
  <g transform="translate(140, 60)">
    <rect width="520" height="300" rx="20" fill="rgba(30, 41, 59, 0.65)" stroke="url(#accGrad)" stroke-width="2" filter="url(#glowEffect)" />
    
    <!-- Central Icon Circle -->
    <circle cx="260" cy="110" r="54" fill="url(#accGrad)" filter="url(#glowEffect)" opacity="0.9" />
    <circle cx="260" cy="110" r="62" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4" />
    <text x="260" y="125" font-size="44" text-anchor="middle">🤖</text>

    <!-- Main Title (English) -->
    <text x="260" y="205" font-family="'Inter', 'Segoe UI', sans-serif" font-size="21" font-weight="800" fill="#F8FAFC" text-anchor="middle">
      AI Coding &amp; Robotics Engineering
    </text>

    <!-- Subtitle (English) -->
    <text x="260" y="235" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a78bfa" letter-spacing="1.5" text-anchor="middle">
      YOUTH TECH PIONEERS
    </text>

    <!-- Narrative Description Snippet (English) -->
    <text x="260" y="270" font-family="'Inter', sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">
      Developing intelligent algorithms and hardware prototypes that solve real challenges
    </text>
  </g>

  <!-- AI Synthesis Metadata Badge -->
  <g transform="translate(40, 420)">
    <rect width="210" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="15" r="4" fill="#a78bfa" />
    <text x="32" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">AI GENERATED ASSET</text>
  </g>

  <g transform="translate(560, 420)">
    <text x="200" y="20" font-family="'Inter', sans-serif" font-size="11.5" fill="#64748B" text-anchor="end">MORE THAN GRADES • DMD 1203</text>
  </g>
</svg>