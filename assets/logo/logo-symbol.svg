<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="symTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="symCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="symSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="symGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container Badge -->
  <rect width="120" height="120" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2" />

  <!-- Logo Emblem: Book Morphing into Soaring Falcon Wings & Radiant Human Spirit -->
  <g transform="translate(10, 10)">
    <!-- Base Book Spine -->
    <path d="M 50 82 C 40 85 20 85 10 92 C 10 75 10 50 10 35 C 22 28 38 29 50 36 C 62 29 78 28 90 35 C 90 50 90 75 90 92 C 80 85 60 85 50 82 Z" fill="#1E293B" stroke="url(#symTeal)" stroke-width="2.5" opacity="0.9" />
    
    <!-- Left Wing / Open Book Page -->
    <path d="M 50 80 C 40 76 25 76 14 84 C 14 62 18 42 30 24 C 38 32 46 45 50 60 Z" fill="url(#symTeal)" opacity="0.95" filter="url(#symGlow)" />
    
    <!-- Right Wing / Soaring Falcon Feather -->
    <path d="M 50 80 C 60 76 75 76 86 84 C 86 62 82 42 70 24 C 62 32 54 45 50 60 Z" fill="url(#symCoral)" opacity="0.95" filter="url(#symGlow)" />
    
    <!-- Center Upward Soaring Figure (Human Spirit & Resilience Star) -->
    <circle cx="50" cy="18" r="8" fill="url(#symSun)" filter="url(#symGlow)" />
    <path d="M 50 28 C 45 35 44 48 50 56 C 56 48 55 35 50 28 Z" fill="url(#symSun)" />
  </g>
</svg>